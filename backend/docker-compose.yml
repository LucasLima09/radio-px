services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: radio
      POSTGRES_PASSWORD: radio
      POSTGRES_DB: radio_px
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radio -d radio_px"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://radio:radio@db:5432/radio_px?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-please-change-32char}
      HTTP_PORT: "8080"
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      STUN_SERVERS: ${STUN_SERVERS:-stun:stun.l.google.com:19302}
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    command: air -c .air.toml
    restart: unless-stopped

volumes:
  pgdata: